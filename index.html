<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#323437">
  <meta name="description" content="Food Picker ITF — สุ่มเมนูอาหารง่าย ๆ ในสไตล์มินิมอล">
  <title>FOODPICKER-ITF · Week17</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #323437;
      --card: #2c2e31;
      --accent: #e2b714;
      --accent-hover: #f0c62f;
      --text: #d1d0c5;
      --muted: #646669;
      --line: rgba(209, 208, 197, 0.08);
      --font: "Roboto Mono", "Prompt", monospace;
    }

    * {
      box-sizing: border-box;
    }

    html {
      color-scheme: dark;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button {
      font: inherit;
    }

    ::selection {
      background: var(--accent);
      color: var(--bg);
    }

    /* ---------- Top bar ---------- */
    .topbar {
      border-bottom: 1px solid var(--line);
    }

    .topbar__inner {
      width: min(100%, 1080px);
      margin: 0 auto;
      padding: 25px 32px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 24px;
    }

    .topbar__meta {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.08em;
      line-height: 1.5;
      white-space: nowrap;
    }

    .topbar__meta--right {
      text-align: right;
    }

    .topbar__title {
      margin: 0;
      padding-left: 0.24em;
      color: var(--accent);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.24em;
      line-height: 1.5;
      text-align: center;
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* ---------- Page ---------- */
    .page {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 48px 24px 64px;
    }

    .picker {
      width: min(100%, 500px);
      animation: enter 500ms ease-out both;
    }

    /* ---------- Card ---------- */
    .card {
      overflow: hidden;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.16);
    }

    .card__media {
      aspect-ratio: 16 / 10;
      overflow: hidden;
      background: #26282b;
    }

    .card__image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.95) saturate(0.95);
    }

    .card__body {
      padding: 24px 28px 28px;
    }

    .card__heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px 16px;
    }

    .card__name {
      margin: 0;
      color: var(--accent);
      font-family: var(--font);
      font-size: 26px;
      font-weight: 500;
      line-height: 1.35;
    }

    .card__price {
      flex: 0 0 auto;
      padding: 5px 10px;
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 999px;
      font-family: var(--font);
      font-size: 11px;
      font-weight: 400;
      line-height: 1.5;
      letter-spacing: 0.01em;
      white-space: nowrap;
    }

    .card__desc {
      margin: 10px 0 0;
      color: var(--muted);
      font-family: var(--font);
      font-size: 14px;
      font-weight: 400;
      line-height: 1.7;
    }

    /* ---------- Random button ---------- */
    .shuffle {
      width: 100%;
      margin-top: 18px;
      padding: 15px 24px;
      color: var(--bg);
      background: var(--accent);
      border: 0;
      border-radius: 12px;
      font-family: var(--font);
      font-size: 15px;
      font-weight: 500;
      line-height: 1.5;
      cursor: pointer;
      transition: background-color 160ms ease, transform 160ms ease, box-shadow 160ms ease;
    }

    .shuffle:hover {
      background: var(--accent-hover);
      box-shadow: 0 8px 24px rgba(226, 183, 20, 0.14);
      transform: translateY(-1px);
    }

    .shuffle:active {
      transform: translateY(0);
    }

    .shuffle:focus-visible {
      outline: 2px solid var(--text);
      outline-offset: 3px;
    }

    /* ---------- Updates ---------- */
    .card.is-refreshing .card__image {
      animation: image-in 300ms ease-out;
    }

    .card.is-refreshing .card__body {
      animation: content-in 300ms ease-out;
    }

    @keyframes enter {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes image-in {
      from { opacity: 0.35; }
      to { opacity: 1; }
    }

    @keyframes content-in {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ---------- Responsive ---------- */
    @media (max-width: 560px) {
      .topbar__inner {
        padding: 21px 20px;
        gap: 12px;
      }

      .topbar__meta {
        font-size: 10px;
        letter-spacing: 0.06em;
      }

      .topbar__title {
        padding-left: 0.18em;
        font-size: 11px;
        letter-spacing: 0.18em;
      }

      .page {
        padding: 32px 18px 44px;
      }

      .card__media {
        aspect-ratio: 4 / 3;
      }

      .card__body {
        padding: 20px;
      }

      .card__name {
        font-size: 23px;
      }

      .card__desc {
        font-size: 13.5px;
      }

      .shuffle {
        padding: 14px 20px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner">
      <span class="topbar__meta">69070217</span>
      <h1 class="topbar__title">FOODPICKER-ITF</h1>
      <span class="topbar__meta topbar__meta--right">Week17</span>
    </div>
  </header>

  <main class="page">
    <div class="picker">
      <article class="card" id="dishCard" aria-labelledby="dishName">
        <div class="card__media">
          <img
            class="card__image"
            id="dishImage"
            src="https://images.unsplash.com/photo-1562565652-a0d8f0c59eb4?auto=format&fit=crop&w=1200&q=80"
            alt="ข้าวหมูกรอบ"
            width="800"
            height="500"
            fetchpriority="high"
          >
        </div>
        <div class="card__body" aria-live="polite" aria-atomic="true">
          <div class="card__heading">
            <h2 class="card__name" id="dishName">ข้าวหมูกรอบ</h2>
            <span class="card__price" id="dishPrice">ราคา 50-67 บาท</span>
          </div>
          <p class="card__desc" id="dishDesc">น้ำจิ้มเด็ดๆ หมูกรอบลั่นๆ</p>
        </div>
      </article>

      <button class="shuffle" id="shuffleBtn" type="button" aria-controls="dishCard">
        สุ่มเมนูอาหาร
      </button>
    </div>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
