<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile Card & To-do List</title>
<style>
  :root {
    --bg: #eef4fb;
    --card: #ffffff;
    --text: #1e2a3a;
    --muted: #6b7a90;
    --blue: #3b82f6;
    --blue-soft: #e8f1fe;
    --line: #e3eaf3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans Thai", "Sarabun", system-ui, sans-serif;
  }
  .card {
    display: flex;
    width: 100%;
    max-width: 780px;
    background: var(--card);
    border-radius: 20px;
    box-shadow: 0 12px 32px rgba(59, 130, 246, 0.12);
    padding: 40px 0;
  }
  .profile, .todo { padding: 0 40px; }
  .profile {
    flex: 0 0 300px;
    text-align: center;
    border-right: 1px solid var(--line);
  }
  .profile img {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid var(--blue);
  }
  .profile h1 { font-size: 1.3rem; margin: 20px 0 8px; }
  .profile p { margin: 6px 0; font-size: 0.9rem; color: var(--muted); }
  .profile a {
    display: inline-block;
    margin-top: 12px;
    color: var(--blue);
    font-weight: 600;
    text-decoration: none;
  }
  .profile a:hover { text-decoration: underline; }
  .todo { flex: 1; }
  .todo h2 { font-size: 1.2rem; margin: 0 0 20px; color: var(--blue); }
  .add-row { display: flex; gap: 8px; margin-bottom: 12px; }
  #todo-input {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font: inherit;
    font-size: 0.9rem;
    color: var(--text);
  }
  #todo-input:focus { outline: 2px solid var(--blue-soft); border-color: var(--blue); }
  button {
    font: inherit;
    font-size: 0.85rem;
    cursor: pointer;
    border-radius: 8px;
    border: none;
  }
  #add-btn { padding: 10px 18px; background: var(--blue); color: #fff; }
  #add-btn:hover { background: #2f6fdb; }
  #todo-list { list-style: none; margin: 0; padding: 0; }
  #todo-list li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
    font-size: 0.95rem;
  }
  #todo-list li:last-child { border-bottom: none; }
  .del-btn { padding: 6px 12px; background: var(--blue-soft); color: var(--blue); }
  .del-btn:hover { background: #d3e5fd; }
  @media (max-width: 640px) {
    .card { flex-direction: column; gap: 28px; }
    .profile { flex: none; border-right: none; border-bottom: 1px solid var(--line); padding-bottom: 28px; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="profile">
      <img src="pic1.jpg" alt="รูปโปรไฟล์">
      <h1>Suwijak Nopphan</h1>
      <p>Student id : 69070217</p>
      <p>IT KMITL</p>
      <p>Normal Ppl that like to play games</p>
      <p>SKILLS : Basic Python, Fixing Computer ,Sleep like 4 hours and still survive</p>
      <a href="https://github.com/Suw1-9" target="_blank">GitHub  huj</a>
    </div>

    <div class="todo">
      <h2>To-do List</h2>
      <div class="add-row">
        <input type="text" id="todo-input" placeholder="พิมพ์สิ่งที่ต้องทำ...">
        <button id="add-btn">เพิ่ม</button>
      </div>
      <ul id="todo-list"></ul>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
